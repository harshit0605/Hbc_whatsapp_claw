[project]
name = "society-skills"
version = "0.1.0"
description = "Skills (MCP tools) + HTTP API for the society maintenance WhatsApp bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "anthropic>=0.39",
    "httpx>=0.27",
    "boto3>=1.35",
    "python-multipart>=0.0.17",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3",
    "mcp>=1.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
