# Local development stack.
# In production, postgres + object storage are typically managed services;
# the skills service, admin portal, and OpenCLAW gateway run on a single
# small VPS as containers.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-society}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-society_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-society}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-society} -d ${POSTGRES_DB:-society}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio_admin_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minio_admin} ${S3_SECRET_ACCESS_KEY:-minio_admin_password} &&
        mc mb --ignore-existing local/${S3_BUCKET:-society-media} &&
        echo 'MinIO bucket ready'
      "
    restart: "no"

  skills-migrate:
    build:
      context: ./services/skills
      dockerfile: Dockerfile
    image: society-skills:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  skills:
    image: society-skills:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network these hosts are services, not localhost.
      POSTGRES_HOST: postgres
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      skills-migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: ["python", "-m", "society_skills.main", "http"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  openclaw:
    # Build context is the repo root so the Dockerfile can COPY the skills
    # service into the same image — it spawns the MCP stdio server from there.
    build:
      context: .
      dockerfile: infra/openclaw/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SKILLS_API_BASE_URL: http://skills:8080
    depends_on:
      skills:
        condition: service_healthy
    ports:
      - "7787:7787"
    volumes:
      - ./infra/openclaw/config.yaml:/openclaw/config.yaml:ro
      - ./infra/openclaw/system_prompt.md:/openclaw/system_prompt.md:ro
      - ./infra/openclaw/plugins:/openclaw/plugins:ro
      - openclaw-data:/data/credentials

  admin-portal:
    build:
      context: ./apps/admin-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SKILLS_API_BASE_URL: http://skills:8080
    depends_on:
      skills:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  minio-data:
  openclaw-data:
