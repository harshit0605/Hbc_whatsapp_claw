[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkgraph"
version = "0.1.0"
description = "Record conversations, extract structured insights, build a cross-conversation knowledge graph."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.50",
    "neo4j>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/talkgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
