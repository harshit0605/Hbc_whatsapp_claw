services:
  neo4j:
    image: neo4j:5
    container_name: talkgraph-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      # Single source of truth: NEO4J_PASSWORD in .env. Default keeps dev painless.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-talkgraph-dev}
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
